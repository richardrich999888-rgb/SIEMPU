name: Endpoint PKCS11 acceptance
on:
  push:
    branches: ['codex/siepmu-evaluation-integrations', 'codex/siepmu-managed-endpoint-pack']
  pull_request:
    paths:
      [
        'integrations/pkcs11/**',
        'tests/pkcs11/**',
        'packages/crypto/crypto.mjs',
        '.github/workflows/endpoint-native.yml',
        '.github/actions/setup-trivy/**',
        '.github/actions/setup-pkcs11-lab/**',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pkcs11:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - name: Prepare pinned PKCS11 laboratory
        uses: ./.github/actions/setup-pkcs11-lab
      - name: Exercise native key operations and negative cases
        shell: bash
        run: |
          set -euo pipefail
          export SIEPMU_PKCS11_LAB_CONFIG="$RUNNER_TEMP/pkcs11-lab/config.json"
          node --test --test-reporter=tap tests/pkcs11/provider.check.mjs > artifacts/pkcs11/tests.tap
      - name: Install hash-pinned scanner
        uses: ./.github/actions/setup-trivy
      - name: Scan isolated Python dependency lock
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          skip-setup-trivy: true
          cache: false
          scan-type: fs
          scan-ref: integrations/pkcs11
          format: json
          output: artifacts/pkcs11/dependency-scan.json
          list-all-pkgs: true
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Require both dependency versions in scanner output
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/pkcs11/dependency-scan.json').read_text())
          found={(p['Name'],p['Version']) for r in report.get('Results',[]) for p in r.get('Packages',[])}
          assert {('python-pkcs11','0.10.1'),('asn1crypto','1.5.1')} <= found, 'incomplete Python dependency scan'
          PYTHON
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pkcs11-software-token-acceptance
          path: artifacts/pkcs11/
          if-no-files-found: error
          retention-days: 14
