name: Endpoint PKCS11 acceptance
on:
  push:
    branches: ['codex/siepmu-evaluation-integrations']
  pull_request:
    paths:
      [
        'integrations/pkcs11/**',
        'tests/pkcs11/**',
        'packages/crypto/crypto.mjs',
        '.github/workflows/endpoint-native.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pkcs11:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - name: Build exact SoftHSM source and install hash-locked Python wheels
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          lab="$RUNNER_TEMP/pkcs11-lab"
          mkdir -p "$lab" artifacts/pkcs11
          python3.12 -m venv "$lab/venv"
          "$lab/venv/bin/pip" --disable-pip-version-check install --require-hashes --only-binary=:all: -r integrations/pkcs11/requirements.txt
          git clone --quiet https://github.com/softhsm/SoftHSMv2.git "$lab/source"
          git -C "$lab/source" checkout --detach 13e6e86b83748fef74046dbf0c91f664b7acc1c3
          test "$(git -C "$lab/source" rev-parse HEAD)" = 13e6e86b83748fef74046dbf0c91f664b7acc1c3
          cmake -S "$lab/source" -B "$lab/build" -DCMAKE_INSTALL_PREFIX="$lab/install" -DBUILD_TESTS=OFF -DWITH_MIGRATE=OFF
          cmake --build "$lab/build" -j2
          cmake --install "$lab/build"
          export SIEPMU_PKCS11_LAB="$lab"
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          lab=Path(os.environ['SIEPMU_PKCS11_LAB'])
          config={'python':str(lab/'venv/bin/python'),'module':str(lab/'install/lib/softhsm/libsofthsm2.so'),'util':str(lab/'install/bin/softhsm2-util')}
          (lab/'config.json').write_text(json.dumps(config))
          report={'kind':'SOFTWARE_TOKEN_LAB_ONLY','gitCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'gitTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'softHsmSource':'13e6e86b83748fef74046dbf0c91f664b7acc1c3','sha256':{k:hashlib.sha256(Path(p).read_bytes()).hexdigest() for k,p in config.items()},'hardwareQualified':False,'sagGraded':False}
          Path('artifacts/pkcs11/inventory.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Exercise native key operations and negative cases
        shell: bash
        run: |
          set -euo pipefail
          export SIEPMU_PKCS11_LAB_CONFIG="$RUNNER_TEMP/pkcs11-lab/config.json"
          node --test --test-reporter=tap tests/pkcs11/provider.check.mjs > artifacts/pkcs11/tests.tap
      - name: Scan isolated Python dependency lock
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          cache: false
          scan-type: fs
          scan-ref: integrations/pkcs11
          format: json
          output: artifacts/pkcs11/dependency-scan.json
          list-all-pkgs: true
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Require both dependency versions in scanner output
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/pkcs11/dependency-scan.json').read_text())
          found={(p['Name'],p['Version']) for r in report.get('Results',[]) for p in r.get('Packages',[])}
          assert {('python-pkcs11','0.10.1'),('asn1crypto','1.5.1')} <= found, 'incomplete Python dependency scan'
          PYTHON
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pkcs11-software-token-acceptance
          path: artifacts/pkcs11/
          if-no-files-found: error
          retention-days: 14
