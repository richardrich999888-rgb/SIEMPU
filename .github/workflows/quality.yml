name: Quality and security evidence
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-07
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, resolved 2026-10-07
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate source-bound claims and implementation
        run: npm run validate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, resolved 2026-10-07
        if: always()
        with:
          name: native-evidence
          path: |
            artifacts/validation/report.json
            artifacts/validation/*.log
            artifacts/application.cdx.json
            dist/manifest.json
          if-no-files-found: error
          retention-days: 14
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-07
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3, resolved 2026-10-07
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-07
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4, resolved 2026-10-07
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4, resolved 2026-10-07
        with:
          output: artifacts/codeql
      - name: Block high or critical SAST findings
        run: node scripts/sarif-gate.mjs artifacts/codeql
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: codeql-gate
          path: |
            artifacts/codeql/gate.json
            artifacts/codeql/**/*.sarif
          if-no-files-found: warn
          retention-days: 14
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-07
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - run: docker compose config --quiet
      - name: Build commit-identified image
        run: docker build --pull --build-arg SIEPMU_BUILD_REVISION="$GITHUB_SHA" --build-arg SIEPMU_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t syntriass-siepmu:local .
      - name: Run three-service synthetic deployment
        run: |
          docker compose run --rm bootstrap >/dev/null
          docker compose up -d --wait --wait-timeout 90
          curl --ipv4 --fail --silent --show-error --retry 3 --retry-connrefused http://localhost:8080/api/meta >/dev/null
          response=$(curl --ipv4 --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Origin: http://localhost:8080' -H 'Content-Type: application/json' --data '{"username":"synthetic-nonexistent","password":"not-a-credential","otp":"000000"}' http://localhost:8080/api/auth/login)
          test "$response" = "401"
          test "$(docker compose exec -T web id -u)" = "1000"
          curl --ipv4 --fail --silent --show-error http://localhost:8080/api/meta | node -e 'let s="";process.stdin.on("data",b=>s+=b);process.stdin.on("end",()=>{const m=JSON.parse(s);if(m.build?.revision!==process.env.GITHUB_SHA||!m.build?.builtAt)process.exit(1);});'
      - name: Verify cryptography and policy in actual containers
        run: |
          docker compose exec -T control node -e 'const v=process.config.variables; console.log(JSON.stringify({node:process.version,openssl:process.versions.openssl,sharedOpenSSL:v.node_shared_openssl,quic:v.node_use_quic})); if(v.node_use_quic) process.exit(1);'
          docker compose cp control:/var/lib/siepmu/control/demo-profiles.json "$RUNNER_TEMP/siepmu-container-profiles.json"
          SIEPMU_URL=http://localhost:8080 SIEPMU_CONTAINER_PROFILES="$RUNNER_TEMP/siepmu-container-profiles.json" node scripts/container-acceptance.mjs
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          cache: false
          image-ref: syntriass-siepmu:local
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          cache: false
          image-ref: syntriass-siepmu:local
          format: cyclonedx
          output: image.cdx.json
          exit-code: '0'
          scanners: vuln
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, resolved 2026-10-07
        with:
          name: image-sbom
          path: image.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Diagnose failed container startup or scan
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 100 relay control web
      - if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -f "$RUNNER_TEMP/siepmu-container-profiles.json"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - name: Provision isolated synthetic browser deployment
        run: |
          npm run bootstrap >/dev/null
          node scripts/start.mjs >/tmp/siepmu-browser-services.log 2>&1 &
          echo "$!" >/tmp/siepmu-browser-services.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8080/health/ready >/dev/null
      - name: Real browser acceptance
        run: |
          mkdir -p artifacts/browser
          set -o pipefail
          node apps/unit-client/browser-check.mjs 2>&1 | tee artifacts/browser/results.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/browser/results.txt
            artifacts/browser/recipient.png
            artifacts/browser/authority.png
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable identities
        if: always()
        run: |
          if test -f /tmp/siepmu-browser-services.pid; then kill "$(cat /tmp/siepmu-browser-services.pid)" || true; fi
          rm -rf .data

  package-candidate:
    needs: [native, secret-scan, codeql, container, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build && npm run sbom
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: image-sbom
          path: artifacts/release
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: native-evidence
          path: artifacts/release/evidence/native
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: browser-evidence
          path: artifacts/release/evidence/browser
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: codeql-gate
          path: artifacts/release/evidence/codeql
      - name: Exercise the actual release packager
        run: node scripts/release.mjs
      - name: Verify all generated checksums
        working-directory: artifacts/release
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate-${{ github.sha }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30
