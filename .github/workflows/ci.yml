name: CI
on:
  push:
    branches:
      [main, 'feature/**', 'security/**', 'release/**', 'hotfix/**', 'codex/**', 'claude/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-07
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, resolved 2026-10-07
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate research traceability and corruption checks
        run: python3 research/trl56/validate.py --self-test
      - name: Validate source-bound claims and implementation
        run: npm run validate
      - name: Required vertical slice acceptance tests
        run: npm run test:e2e
      - name: Trust Before Release demonstration on the secure stack (synthetic)
        run: npm run demo:trust-before-release
        env:
          SIEPMU_TBR_ITERATIONS: '10'
      - name: Record candidate engineering evidence
        run: node scripts/record-engineering-evidence.mjs --verified
      - name: Require native evidence after successful checks
        run: test -s artifacts/validation/report.json && test -s artifacts/application.cdx.json && test -s dist/manifest.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, resolved 2026-10-07
        if: always()
        with:
          name: native-evidence
          path: |
            artifacts/validation/report.json
            artifacts/validation/*.log
            artifacts/validation/engineering-evidence.json
            artifacts/trust-before-release/report.json
            artifacts/trust-before-release/report.md
            artifacts/application.cdx.json
            dist/manifest.json
          if-no-files-found: warn
          retention-days: 14
  pqc-lab:
    # Isolated laboratory package: pinned Noble (X-Wing) plus native OpenSSL ML-KEM/ML-DSA.
    # Known-answer and interoperability evidence only; not module validation or approval.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-07
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, resolved 2026-10-07
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/pqc-lab --ignore-scripts --no-audit --no-fund
      - name: Native ML-KEM/ML-DSA NIST vectors and provider tests
        run: node --test --test-concurrency=1 tests/pqc/*.test.mjs tests/crypto-agility/*.test.mjs
      - name: X-Wing author vectors, Noble/OpenSSL interoperability and lab end-to-end checks
        run: npm --prefix packages/pqc-lab test
  rust-native:
    # Rust reference components (ADR-011): format, lint, unit and vector conformance tests,
    # RustSec advisory audit, then byte-level differential checks against the Node reference.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-07
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, resolved 2026-10-07
        with:
          node-version: 24.21.0
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version && cargo --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format and lint (warnings are errors)
        working-directory: native
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Unit and language-neutral vector conformance tests
        working-directory: native
        run: cargo test --locked
      - name: RustSec advisory audit of the committed lockfile
        working-directory: native
        run: |
          cargo install cargo-audit --version 0.22.0 --locked
          cargo audit --deny warnings
      - name: Committed vectors still describe the Node reference
        run: npm run vectors:check
      - name: Build release verifier
        run: npm run build:native
      - name: Differential check against the Node reference (real demo evidence and seeded mutations)
        run: npm run test:native
      - name: Measure Node and Rust verifiers
        run: node scripts/native-benchmark.mjs --sizes 1000,10000 --runs 3
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, resolved 2026-10-07
        if: always()
        with:
          name: rust-native-evidence
          path: artifacts/native/benchmark.json
          if-no-files-found: warn
          retention-days: 14
  formal:
    # TLA+ model of release, revocation and recovery (formal/README.md). The faithful model must
    # pass and each deliberately broken design must violate its target property.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      TLA2TOOLS_SHA256: 7beec0f04818732a62fa193731711a99aa4f11279499b2360a7d156c519ea78d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-07
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, resolved 2026-10-07
        with:
          node-version: 24.21.0
      - name: Fetch and verify pinned TLA+ tools
        run: |
          java -version
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/tla2tools.jar" "$TLA2TOOLS_URL"
          echo "$TLA2TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check --strict
      - name: Model-check faithful model and both mutants
        run: SIEPMU_TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar" npm run formal:check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, resolved 2026-10-07
        if: always()
        with:
          name: formal-evidence
          path: artifacts/formal/report.json
          if-no-files-found: warn
          retention-days: 14
  container:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-07
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: docker compose config --quiet
      - name: Build commit-identified image
        run: docker build --pull --build-arg SIEPMU_BUILD_REVISION="$GITHUB_SHA" --build-arg SIEPMU_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t syntriass-siepmu:local .
      - name: Run three-service synthetic deployment
        run: |
          docker compose run --rm bootstrap >/dev/null
          docker compose up -d --wait --wait-timeout 90
          curl --ipv4 -H 'Host: localhost:8080' --fail --silent --show-error --retry 3 --retry-connrefused http://127.0.0.1:8080/api/meta >/dev/null
          response=$(curl --ipv4 -H 'Host: localhost:8080' --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Origin: http://localhost:8080' -H 'Content-Type: application/json' --data '{"username":"synthetic-nonexistent","password":"not-a-credential","otp":"000000"}' http://127.0.0.1:8080/api/auth/login)
          test "$response" = "401"
          test "$(docker compose exec -T web id -u)" = "1000"
          curl --ipv4 -H 'Host: localhost:8080' --fail --silent --show-error http://127.0.0.1:8080/api/meta | node -e 'let s="";process.stdin.on("data",b=>s+=b);process.stdin.on("end",()=>{const m=JSON.parse(s);if(m.build?.revision!==process.env.GITHUB_SHA||!m.build?.builtAt)process.exit(1);});'
      - name: Verify cryptography and policy in actual containers
        run: |
          docker compose exec -T control node -e 'const v=process.config.variables; console.log(JSON.stringify({node:process.version,openssl:process.versions.openssl,sharedOpenSSL:v.node_shared_openssl,quic:v.node_use_quic})); if(v.node_use_quic !== false) process.exit(1);'
          umask 077
          docker compose cp control:/var/lib/siepmu/control/demo-profiles.json "$RUNNER_TEMP/siepmu-container-profiles.json"
          chmod 600 "$RUNNER_TEMP/siepmu-container-profiles.json"
          SIEPMU_URL=http://localhost:8080 SIEPMU_CONTAINER_PROFILES="$RUNNER_TEMP/siepmu-container-profiles.json" node --dns-result-order=ipv4first scripts/container-acceptance.mjs
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          cache: false
          image-ref: syntriass-siepmu:local
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          cache: false
          image-ref: syntriass-siepmu:local
          format: cyclonedx
          output: image.cdx.json
          exit-code: '0'
          scanners: vuln
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, resolved 2026-10-07
        with:
          name: image-sbom
          path: image.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Diagnose failed container startup or scan
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 100 relay control web
      - if: always()
        run: |
          rm -f "$RUNNER_TEMP/siepmu-container-profiles.json"
          docker compose down --volumes --remove-orphans

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - name: Isolated real browser acceptance
        run: |
          mkdir -p artifacts/browser
          set -o pipefail
          npm run test:browser:isolated 2>&1 | tee artifacts/browser/results.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/browser/results.txt
            artifacts/browser/recipient.png
            artifacts/browser/authority.png
          if-no-files-found: warn
          retention-days: 14

  testbed:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - name: Build pinned laboratory runtime
        run: docker build --pull --build-arg SIEPMU_BUILD_REVISION="$GITHUB_SHA" --build-arg SIEPMU_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t syntriass-siepmu:local .
      - name: Provision separate synthetic identities and custody mounts
        run: |
          node deployment/testbed/provision.mjs
          docker compose -f artifacts/testbed/compose.json config --quiet
          sudo chown -R 1000:1000 .data/testbed
          docker image inspect syntriass-siepmu:local > artifacts/testbed/image.json
      - name: Execute independent zones under recorded Linux netem conditions
        run: node deployment/testbed/run.mjs
      - name: Require measured impairment and no authorization failures
        run: |
          node --input-type=module -e "import{readFileSync}from'node:fs';const r=JSON.parse(readFileSync('artifacts/testbed/measurements.json'));if(r.revision!==process.env.GITHUB_SHA||r.failures.length||r.summary.successfulExchanges!==75)process.exit(1);"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: isolated-testbed-evidence
          path: |
            artifacts/testbed/measurements.json
            artifacts/testbed/topology.json
            artifacts/testbed/compose.json
            artifacts/testbed/image.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop laboratory zones
        if: always()
        run: docker compose -f artifacts/testbed/compose.json down --remove-orphans || true
